name: CI

# Hosted CI for the Rust FFI and Linux SOURCE arm (host stubs). This is the only
# pull_request-capable workflow, so untrusted changes never run on a persistent
# self-hosted machine. Trusted macOS source- and binary-arm coverage lives in
# ci-macos-trusted.yml and runs only after a push to main or manual dispatch.
#
# The Linux source arm compiles the thin C bridge + RecklessHostStubs.c (no-op
# rk_ffi_* symbols), proving the package builds and tests without the binary
# engine. The NNUE net is gitignored, so its live-engine smoke test records a
# skip. The Release workflow separately rebuilds the exact binary, stages the
# NNUE network, and runs both Rust and Swift live-engine tests before publish.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust FFI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: cargo test
        run: cargo test --manifest-path rust/Cargo.toml --locked

  linux-x86_64:
    name: Linux x86_64 (source arm)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Exercise the package's declared minimum tools version, not a floating SDK.
    container: swift:6.0.3-jammy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: swift build
        run: swift build
      - name: swift test
        run: swift test
      - name: Versioned remote-consumer build
        shell: bash
        run: |
          set -euo pipefail
          BARE_REPO="${RUNNER_TEMP}/SwiftReckless.git"
          git clone --bare . "${BARE_REPO}"
          git --git-dir="${BARE_REPO}" tag 999.0.0 "${GITHUB_SHA}"
          SWIFTRECKLESS_TEST_URL="file://${BARE_REPO}" \
            swift run \
              --package-path Tests/RemoteConsumer \
              --scratch-path "${RUNNER_TEMP}/remote-consumer-build"
