name: CI

# Build + test the SOURCE arm (host stubs) on Linux and macOS.
#
# SOURCE ARM rationale: the committed RecklessFFI.xcframework only serves
# Apple hosts; the source arm (non-Apple host, or
# SWIFTRECKLESS_FORCE_SOURCE_BUILD=1 on macOS) compiles the thin C bridge +
# RecklessHostStubs.c (no-op rk_ffi_* symbols), proving the package builds and
# tests on Linux and on macOS without the binary engine.  The NNUE net is
# gitignored, so the net-guarded engine smoke test records a skip.
#
# The BINARY arm (the real Rust engine via the committed xcframework) is
# validated by this workflow's tagged-release step and by the Release workflow.
#
# Runs on every push to `main`, every PR, and every version tag. On a tagged
# release the self-hosted macOS runner additionally stages the NNUE net and runs
# the REAL engine (binary arm, the committed xcframework) smoke test — see the
# macOS job below — so a release validates the actual FFI, not just host stubs.

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - '*.*.*'
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-x86_64:
    name: Linux x86_64 (source arm)
    runs-on: ubuntu-latest
    container: swift:latest
    steps:
      - uses: actions/checkout@v4
      - name: swift build
        run: swift build
      - name: swift test
        run: swift test

  macos-self-hosted:
    name: macOS — self-hosted (Intel Mac Pro, source arm)
    runs-on: [self-hosted, macOS]
    env:
      # Force the source arm past the prebuilt RecklessFFI.xcframework
      # (committed, ~150 MB — forced off here so this job exercises the
      # stub/source arm).  The xcframework is validated by the tagged-release
      # step below and by the Release workflow.
      SWIFTRECKLESS_FORCE_SOURCE_BUILD: '1'
    steps:
      - uses: actions/checkout@v4
      - name: swift build
        run: swift build
      - name: swift test
        # The NNUE-guarded live engine smoke test skips cleanly when the
        # net file is absent (gitignored).  All other tests run normally.
        run: swift test
      - name: Live engine smoke — binary arm (tagged releases only)
        # On a version tag, stage the net and run the REAL engine via the
        # committed RecklessFFI.xcframework (binary arm — override the source
        # force with an empty value) so a release validates the actual FFI.
        if: startsWith(github.ref, 'refs/tags/')
        env:
          SWIFTRECKLESS_FORCE_SOURCE_BUILD: ''
        run: |
          mkdir -p rust/networks
          curl -fsSL -o rust/networks/v54-5478683c.nnue \
            https://github.com/codedeliveryservice/RecklessNetworks/releases/download/networks/v54-5478683c.nnue
          # Isolated scratch path so the binary arm builds fresh and is never
          # served the source-arm (stub) build graph the earlier steps put under
          # .build (SwiftPM does not always re-evaluate the arm on an env change).
          swift test --scratch-path .build-binary
