name: SwiftReckless — CI (Linux + Rust)

# Hosted CI for the Rust FFI and Linux source-stub package path. This is the only
# pull_request-capable workflow, so untrusted changes never run on a persistent
# self-hosted machine. Trusted macOS source-stub and prebuilt-XCFramework coverage lives in
# ci-macos-trusted.yml and runs only after a push to main or manual dispatch.
#
# The Linux source-stub path compiles the thin C bridge + RecklessHostStubs.c (no-op
# rk_ffi_* symbols), proving the package builds and tests without the binary
# engine. The NNUE net is gitignored, so its live-engine smoke test records a
# skip. The Release workflow separately rebuilds the exact binary, stages the
# NNUE network, and runs both Rust and Swift live-engine tests before publish.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: SwiftReckless — Rust FFI tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout SwiftReckless
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test Rust FFI crate
        run: cargo test --manifest-path rust/Cargo.toml --locked

  linux-x86_64:
    name: SwiftReckless — source-stub package tests (Linux x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Exercise the package's declared minimum tools version, not a floating SDK.
    container: swift:6.0.3-jammy
    steps:
      - name: Checkout SwiftReckless
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build source-stub package path
        run: swift build
      - name: Test source-stub package path
        # This job supplies no creckless archive, so it MUST link stubs. Saying
        # so turns a green run from "something built" into "the intended thing
        # built": without the assertion, a stub link and a real link are
        # indistinguishable here, and a silently stubbed engine is the failure
        # this package is designed to make impossible.
        env:
          SWIFTRECKLESS_EXPECT_BACKEND: stub
        run: swift test
      - name: Versioned remote-consumer build
        shell: bash
        run: |
          set -euo pipefail
          BARE_REPO="${RUNNER_TEMP}/SwiftReckless.git"
          git clone --bare . "${BARE_REPO}"
          git --git-dir="${BARE_REPO}" tag 999.0.0 "${GITHUB_SHA}"
          SWIFTRECKLESS_TEST_URL="file://${BARE_REPO}" \
            swift run \
              --package-path Tests/RemoteConsumer \
              --scratch-path "${RUNNER_TEMP}/remote-consumer-build"
