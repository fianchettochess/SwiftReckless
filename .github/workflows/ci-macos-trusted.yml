name: SwiftReckless — CI (macOS source stubs + prebuilt XCFramework)

# Trusted macOS coverage of both delivery paths on an Intel Mac. It runs only
# after a push to main or an explicit manual dispatch, and pull requests belong
# in `ci.yml`. That limit predates the move to GitHub-hosted runners and is kept
# so that moving this job back to a persistent self-hosted machine stays a
# one-line `runs-on` change. The Release workflow independently rebuilds and
# validates the exact artifact it publishes.

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: trusted-macos-ci-${{ github.ref }}
  cancel-in-progress: true

# No DEVELOPER_DIR here: Tools/verify-macos-build-host.sh selects Xcode 26.x
# for the runner it lands on and exports it to every later step.

jobs:
  macos-intel:
    name: SwiftReckless — source-stub + XCFramework tests (Intel macOS)
    # GitHub-hosted Intel image with Xcode 26.x and rustup; see release.yml for
    # the reasoning. To move back to the self-hosted Mac, change only this line
    # to `[self-hosted, macOS, X64]`.
    runs-on: macos-26-intel
    # Raised from 45 with the XCFramework build: a fresh checkout no longer
    # carries it, so this job compiles the Rust FFI crate for ten slices before
    # it can build or test anything. About 38 minutes on the self-hosted Mac
    # Pro; a 4-vCPU hosted runner that also installs both Rust toolchains from
    # cold needs several times that.
    timeout-minutes: 180
    env:
      # Force the source-stub path past the prebuilt RecklessFFI.xcframework
      # (committed, ~150 MB — forced off here so this job exercises the
      # host-stub path). The prebuilt path is tested below, and a freshly rebuilt
      # artifact is validated by the Release workflow.
      SWIFTRECKLESS_FORCE_SOURCE_BUILD: '1'
    steps:
      - name: Checkout SwiftReckless
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The runner account owns its workspace (hosted or self-hosted);
          # skip adding a global safe-directory exception it does not need.
          set-safe-directory: false
          persist-credentials: false
      - name: Select Xcode 26 and verify toolchain and CPU capabilities
        run: Tools/verify-macos-build-host.sh
      # main is PATH MODE: the binaryTarget points at
      # Frameworks/RecklessFFI.xcframework, and since "Stop committing the
      # xcframework" that file is gitignored and absent from a fresh checkout,
      # so `swift build` dies at manifest load with "local binary target
      # 'RecklessFFI' ... does not contain a binary artifact". Consumers never
      # hit this: they pin a version and SwiftPM fetches the release asset.
      - name: Build the XCFramework this checkout does not carry
        run: Tools/build-xcframework.sh
      - name: Build source-stub package path
        run: swift build
      - name: Test source-stub package path
        # The NNUE-guarded live engine smoke test skips cleanly when the
        # net file is absent (gitignored). All other tests run normally.
        #
        # SWIFTRECKLESS_FORCE_SOURCE_BUILD=1 is set on the job, so Package.swift
        # takes the source arm, CReckless compiles RecklessHostStubs.c, and
        # RecklessBackend.h reports `stub`. Declaring that is what makes the
        # forcing observable: until now this step named no expectation, so the
        # contract test "linked backend matches SWIFTRECKLESS_EXPECT_BACKEND"
        # recorded a skip and the job could not tell "forced the source arm"
        # from "the force flag stopped working and we tested the XCFramework
        # twice".
        env:
          SWIFTRECKLESS_EXPECT_BACKEND: stub
        run: swift test
      - name: Test prebuilt-XCFramework path with live engine
        env:
          SWIFTRECKLESS_FORCE_SOURCE_BUILD: ''
          # Clearing the force flag puts Package.swift back on the Apple binary
          # arm (useBinaryEngine = hostIsApple && (underXcode || !forceSource)),
          # which links RecklessFFI.xcframework and never defines
          # RECKLESS_SOURCE_ARM — so the backend is `real`. This is the only
          # lane in the repo that links the genuine engine, and therefore the
          # only place the `real` half of the contract can ever fire; every
          # other job declares `stub`, so before this line the assertion had
          # only been exercised in one direction.
          #
          # It also closes a green-but-empty hole. If a manifest or environment
          # change ever left this step on the source arm, it would link the
          # no-op stubs, the live engine smoke test below would DISABLE itself
          # (its .enabled(if:) requires a non-stub link) and record a skip, and
          # the job would pass having executed no engine code at all. With the
          # expectation declared, that configuration is a red instead.
          SWIFTRECKLESS_EXPECT_BACKEND: real
        run: |
          set -euo pipefail
          NET='rust/networks/v54-5478683c.nnue'
          PART="${NET}.ci-part"
          mkdir -p rust/networks
          trap 'rm -f "${NET}" "${PART}"' EXIT
          curl -fsSL -o "${PART}" \
            https://github.com/codedeliveryservice/RecklessNetworks/releases/download/networks/v54-5478683c.nnue
          printf '%s  %s\n' \
            '5478683cb1bababde29ae8f29468a99846726548fc6a0ed54cac40ab6d38efbf' \
            "${PART}" | shasum -a 256 -c -
          mv "${PART}" "${NET}"
          swift test --scratch-path .build-binary
