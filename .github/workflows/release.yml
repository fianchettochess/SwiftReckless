name: SwiftReckless — Release XCFramework
run-name: SwiftReckless XCFramework release · ${{ inputs.version }}

# Releases are deliberately manual. The workflow starts from the current
# default-branch commit, rebuilds and tests the exact XCFramework, creates the
# URL-based manifest commit, then creates one stable semver tag through a
# draft release. It never force-moves a tag and never mutates `main`.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New release version / tag (for example 0.9.10)'
        required: true
        type: string
      source_ref:
        description: >-
          Existing TAG to build from, for backfilling a release onto a line the
          default branch has moved past. Leave empty to build the default
          branch, which is the normal case.
        required: false
        default: ''
        type: string

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  VERSION: ${{ inputs.version }}
  ASSET: RecklessFFI.xcframework.zip
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

jobs:
  release:
    name: SwiftReckless — build/publish XCFramework release
    # Manual dispatch checks out only the current default-branch head, so fork
    # pull requests never execute code on this persistent release machine.
    # SECURITY: Before public visibility, restrict the organization runner
    # group to this exact workflow on refs/heads/main. These labels only route
    # the job; they are not an authorization boundary.
    runs-on: [self-hosted, macOS, X64]
    timeout-minutes: 240
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Empty resolves to the default branch, the normal release. A tag
          # builds that line instead — see the source-revision guard.
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          # The runner account owns its workspace; avoid importing its global
          # Git configuration solely to add a safe-directory exception.
          set-safe-directory: false
          # Checkout removes its temporary token before subsequent steps. Git
          # authentication is reintroduced only in the two controlled steps.
          persist-credentials: false

      - name: Validate version, source revision, and collisions
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SOURCE_REF: ${{ inputs.source_ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Step-scoped authentication: no credential or extraheader is written
          # to the runner's global or repository-local Git configuration.
          AUTH_HEADER="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\r\n')"
          echo "::add-mask::${AUTH_HEADER}"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0='http.https://github.com/.extraheader'
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${AUTH_HEADER}"
          export GIT_TERMINAL_PROMPT=0
          unset AUTH_HEADER

          if ! printf '%s' "${VERSION}" | \
            grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "::error::invalid version '${VERSION}' — expected stable N.N.N"
            exit 1
          fi
          UPSTREAM="$(tr -d '\r\n' < .upstream-version)"
          ENGINE_LINE="${UPSTREAM#v}"
          IFS='.' read -r ENGINE_MAJOR ENGINE_MINOR _ <<< "${ENGINE_LINE}"
          if ! printf '%s' "${VERSION}" | \
            grep -Eq "^${ENGINE_MAJOR}\\.${ENGINE_MINOR}\\.[0-9]+$"; then
            echo "::error::version '${VERSION}' must stay on the ${ENGINE_MAJOR}.${ENGINE_MINOR}.x wrapper line for upstream ${UPSTREAM}"
            exit 1
          fi
          git check-ref-format "refs/tags/${VERSION}"
          git fetch --no-tags origin "${DEFAULT_BRANCH}"
          # TWO SOURCES, BOTH REVIEWED. Normally the release must be the current
          # default-branch head. A BACKFILL builds an existing TAG, so a line the
          # branch has moved past can still get a release — it must be a tag that
          # already exists on origin, so this cannot publish an arbitrary commit.
          # (release backfill 2026-09-07)
          if [ -z "${SOURCE_REF}" ]; then
            if [ "$(git rev-parse HEAD)" != "$(git rev-parse "origin/${DEFAULT_BRANCH}")" ]; then
              echo "::error::dispatch this workflow from the current ${DEFAULT_BRANCH} head"
              exit 1
            fi
          else
            if ! git ls-remote --exit-code --tags origin "refs/tags/${SOURCE_REF}" >/dev/null; then
              echo "::error::source_ref '${SOURCE_REF}' is not an existing tag on origin"
              exit 1
            fi
            if [ "$(git rev-parse HEAD)" != "$(git rev-parse "${SOURCE_REF}^{commit}")" ]; then
              echo "::error::checkout is not at '${SOURCE_REF}'"
              exit 1
            fi
            echo "note: backfilling ${VERSION} from tag ${SOURCE_REF}"
          fi
          assert_tag_absent() {
            local status
            if git ls-remote --exit-code --tags origin \
              "refs/tags/${VERSION}" >/dev/null; then
              echo "::error::tag '${VERSION}' already exists; release tags are never re-cut"
              return 1
            else
              status=$?
              if [ "${status}" -ne 2 ]; then
                echo "::error::could not verify that tag '${VERSION}' is unused"
                return "${status}"
              fi
            fi
          }
          assert_tag_absent
          RELEASE_TAGS="$(gh release list --limit 10000 --json tagName \
            --jq '.[].tagName')"
          if printf '%s\n' "${RELEASE_TAGS}" | grep -qxF "${VERSION}"; then
            echo "::error::release '${VERSION}' already exists"
            exit 1
          fi

      - name: Verify self-hosted toolchain and CPU capabilities
        run: |
          set -euo pipefail
          test "$(uname -m)" = 'x86_64'
          test -d "${DEVELOPER_DIR}"
          test -x "${DEVELOPER_DIR}/usr/bin/xcodebuild"

          XCODE_VERSION="$(xcodebuild -version | sed -n '1p')"
          SWIFT_VERSION="$(xcrun swift --version | sed -n '1p')"
          if ! grep -Eq '^Xcode 26([.][0-9]+)*$' <<< "${XCODE_VERSION}"; then
            echo "::error::Xcode 26.x is required; found '${XCODE_VERSION}'"
            exit 1
          fi
          if ! grep -Eq 'Apple Swift version 6([.][0-9]+)*([[:space:]]|$)' \
            <<< "${SWIFT_VERSION}"; then
            echo "::error::Apple Swift 6.x is required; found '${SWIFT_VERSION}'"
            exit 1
          fi
          xcodebuild -version
          xcrun swift --version
          xcrun --sdk macosx --show-sdk-path

          LEAF7_FEATURES="$(sysctl -n machdep.cpu.leaf7_features)"
          BASE_FEATURES="$(sysctl -n machdep.cpu.features)"
          grep -qw AVX2 <<< "${LEAF7_FEATURES}"
          grep -qw BMI2 <<< "${LEAF7_FEATURES}"
          grep -qw POPCNT <<< "${BASE_FEATURES}"

      - name: Build exact XCFramework
        run: |
          chmod +x Tools/build-xcframework.sh
          ./Tools/build-xcframework.sh

      - name: Validate architecture, deployment, and optimized Intel slices
        run: |
          set -euo pipefail
          XCF='Frameworks/RecklessFFI.xcframework'
          WATCH="${XCF}/watchos-arm64_arm64_32/libcreckless-watchos.a"
          MAC="${XCF}/macos-arm64_x86_64/libcreckless-macos.a"
          plutil -lint "${XCF}/Info.plist"
          lipo "${XCF}/ios-arm64/libcreckless.a" -verify_arch arm64
          lipo "${XCF}/ios-arm64_x86_64-simulator/libcreckless-ios-sim.a" \
            -verify_arch arm64 x86_64
          lipo "${XCF}/ios-arm64_x86_64-maccatalyst/libcreckless-maccatalyst.a" \
            -verify_arch arm64 x86_64
          lipo "${XCF}/tvos-arm64/libcreckless.a" -verify_arch arm64
          lipo "${XCF}/tvos-arm64_x86_64-simulator/libcreckless-tvos-sim.a" \
            -verify_arch arm64 x86_64
          lipo "${WATCH}" -verify_arch arm64_32 arm64
          lipo "${XCF}/watchos-arm64_x86_64-simulator/libcreckless-watchos-sim.a" \
            -verify_arch arm64 x86_64
          lipo "${XCF}/xros-arm64/libcreckless.a" -verify_arch arm64
          lipo "${XCF}/xros-arm64-simulator/libcreckless.a" -verify_arch arm64
          lipo "${MAC}" -verify_arch arm64 x86_64

          minos() {
            otool -arch "$1" -l "$2" | \
              awk '$1 == "minos" { print $2 }' | sort -u
          }
          test "$(minos arm64_32 "${WATCH}")" = '6.0'
          test "$(minos arm64 "${WATCH}")" = '26.0'

          DISASSEMBLY="${RUNNER_TEMP}/swiftreckless-x86_64.txt"
          otool -arch x86_64 -tvV "${MAC}" > "${DISASSEMBLY}"
          grep -Eq '[[:space:]](vpbroadcast|vpadd|vpmadd)' "${DISASSEMBLY}"
          grep -Eq '[[:space:]](pextq|pdepq|mulxq|bzhiq)' "${DISASSEMBLY}"
          rm -f "${DISASSEMBLY}"

      - name: Stage and verify the live NNUE network
        run: |
          set -euo pipefail
          mkdir -p rust/networks
          curl -fsSL -o rust/networks/v54-5478683c.nnue \
            https://github.com/codedeliveryservice/RecklessNetworks/releases/download/networks/v54-5478683c.nnue
          printf '%s  %s\n' \
            '5478683cb1bababde29ae8f29468a99846726548fc6a0ed54cac40ab6d38efbf' \
            'rust/networks/v54-5478683c.nnue' | shasum -a 256 -c -

      - name: Test Rust targets against the locked graph
        # The step above staged the net, so ffi_smoke.rs must RUN, not skip.
        # This does not guard the download — `curl -f` plus the checksum above
        # already fail loudly on that. It guards the quieter drift: a net
        # filename bumped in the staging step but not in ffi_smoke.rs, which
        # would otherwise skip the live FFI test and still publish a release.
        env:
          SWIFTRECKLESS_REQUIRE_NET: '1'
        run: cargo test --manifest-path rust/Cargo.toml --locked --all-targets

      - name: Test the terminal-position guard
        run: |
          cargo run \
            --manifest-path rust/Cargo.toml \
            --locked \
            --example terminal_guard

      - name: Test the source arm (live smoke intentionally skipped)
        env:
          SWIFTRECKLESS_FORCE_SOURCE_BUILD: '1'
        run: |
          # This non-Android source arm deliberately links host stubs. The
          # live Swift suite must report its recorded, intentional skip even
          # though the NNUE file is staged; every offline Swift test still runs.
          swift build --scratch-path .build-release-source
          swift test --scratch-path .build-release-source

      - name: Test the freshly rebuilt binary arm and live engine
        env:
          SWIFTRECKLESS_FORCE_SOURCE_BUILD: ''
        run: |
          test -f rust/networks/v54-5478683c.nnue
          swift build --scratch-path .build-release-binary
          swift test --scratch-path .build-release-binary

      - name: Test a versioned remote consumer
        env:
          SWIFTRECKLESS_FORCE_SOURCE_BUILD: ''
        run: |
          set -euo pipefail
          # SwiftPM derives an unnamed URL dependency's package identity from
          # the repository basename. Keep it exactly "SwiftReckless" so the
          # consumer's product dependency resolves as it does from GitHub.
          BARE_REPO="${RUNNER_TEMP}/SwiftReckless.git"
          git clone --bare . "${BARE_REPO}"
          git --git-dir="${BARE_REPO}" tag 999.0.0 "${GITHUB_SHA}"
          SWIFTRECKLESS_TEST_URL="file://${BARE_REPO}" \
            swift run \
              --package-path Tests/RemoteConsumer \
              --scratch-path "${RUNNER_TEMP}/remote-consumer-release"

      - name: Archive and verify the exact asset
        id: checksum
        run: |
          set -euo pipefail
          ditto -c -k --sequesterRsrc --keepParent \
            Frameworks/RecklessFFI.xcframework "${ASSET}"
          CHECKSUM="$(swift package compute-checksum "${ASSET}")"
          echo "checksum=${CHECKSUM}" >> "${GITHUB_OUTPUT}"

          VERIFY_DIR="$(mktemp -d)"
          trap 'rm -rf "${VERIFY_DIR}"' EXIT
          ditto -x -k "${ASSET}" "${VERIFY_DIR}"
          diff -qr Frameworks/RecklessFFI.xcframework \
            "${VERIFY_DIR}/RecklessFFI.xcframework"

      - name: Create the final detached release commit
        id: release_commit
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CHECKSUM: ${{ steps.checksum.outputs.checksum }}
          REPO: ${{ github.repository }}
        run: |
          # KNOWN, RECORDED 2026-09-01: THE MANIFEST THIS PRODUCES CANNOT BE
          # RESOLVED WHILE THIS REPOSITORY IS PRIVATE. Not a defect in the
          # rewrite — a property of the endpoint it points at.
          #
          # MEASURED against the real 0.9.11 asset:
          #
          #   https://github.com/<owner>/<repo>/releases/download/0.9.11/RecklessFFI.xcframework.zip
          #     no auth            -> 404
          #     Authorization: Bearer <token>  -> 404
          #     Authorization: token  <token>  -> 404
          #     Basic x-access-token:<token>   -> 404
          #
          #   https://api.github.com/repos/<owner>/<repo>/releases/assets/509577665
          #     Basic x-access-token:<token>   -> 200 (302 -> real ZIP bytes)
          #
          # SwiftPM CAN authenticate binary downloads — it reads ~/.netrc and
          # says so ("credentials for https://github.com/... found in netrc
          # file") — but GitHub serves private release assets only from the API
          # endpoint, and that URL has no `.zip` path extension, which SwiftPM
          # rejects at manifest validation
          # (supportedRemoteBinaryDependencyExtensions = ["artifactbundleindex",
          # "zip"]). So `swift package resolve` fails badResponseStatusCode(404)
          # with and without credentials.
          #
          # WHY NOBODY HAS HIT IT. No consumer references this package by
          # version: Fianchetto.xcodeproj uses XCLocalSwiftPackageReference
          # "../SwiftReckless", and fianchetto-cmp uses
          # `.package(path: recklessCheckout)`. They all link the COMMITTED
          # xcframework from a sibling checkout. And the "versioned remote
          # consumer" step earlier in this workflow runs BEFORE this rewrite, so
          # it exercises the path manifest rather than the one that ships.
          #
          # WHEN THIS REPOSITORY GOES PUBLIC, releases/download/ starts serving
          # and this becomes real. Verify it then rather than assuming:
          #
          #   swift package resolve   # against the tagged version, from a clean
          #                           # clone with no sibling checkouts present
          #
          # and move the versioned-consumer test to AFTER the rewrite so it
          # tests what is shipped. Only then is the committed xcframework
          # redundant; removing it before that breaks the Apple app's build,
          # which links it from the sibling path.
          set -euo pipefail
          git checkout --detach

          # A BACKFILL CARRIES THE DEFAULT BRANCH'S CI CONFIG, and must: the
          # publish step pushes this commit to a `release-prep/` branch, and
          # GitHub refuses a GITHUB_TOKEN push that "creates or updates" a
          # workflow file — which an old tag's `.github/workflows/` does by
          # definition once the branch has moved. `workflows` is not a grantable
          # GITHUB_TOKEN scope, so there is nothing to permit; the tree must not
          # differ there. `.github/` is not part of the Swift package and no
          # consumer of a release tag reads it. (release backfill 2026-09-07)
          if [ -n "${SOURCE_REF}" ]; then
            git checkout "origin/${DEFAULT_BRANCH}" -- .github
          fi
          python3 .github/scripts/rewrite_binary_target.py \
            "https://github.com/${REPO}/releases/download/${VERSION}/${ASSET}" \
            "${CHECKSUM}"
          swift package dump-package >/dev/null

          git rm -rf --ignore-unmatch Frameworks/RecklessFFI.xcframework
          for pattern in 'Frameworks/*.xcframework' 'RecklessFFI.xcframework.zip'; do
            grep -qxF "${pattern}" .gitignore || printf '%s\n' "${pattern}" >> .gitignore
          done
          git add Package.swift .gitignore
          [ -n "${SOURCE_REF}" ] && git add .github
          git diff --cached --check

          # `.github/` is stageable ONLY on a backfill, for the reason above. On
          # a normal release the tree is already the default branch's, so a
          # difference there would be unexplained.
          ALLOWED='^(Package.swift|\.gitignore|Frameworks/RecklessFFI\.xcframework/)'
          [ -n "${SOURCE_REF}" ] && ALLOWED="${ALLOWED%)}|\.github/)"
          UNEXPECTED="$(git diff --cached --name-only | grep -Ev "${ALLOWED}" || true)"
          if [ -n "${UNEXPECTED}" ]; then
            echo "::error::unexpected paths staged for the release commit"
            printf '%s\n' "${UNEXPECTED}"
            exit 1
          fi

          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Release ${VERSION}: host XCFramework as a release asset"
          echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Stage, verify, and publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_COMMIT: ${{ steps.release_commit.outputs.sha }}
        run: |
          set -euo pipefail
          # Keep write-capable Git authentication inside this publication step;
          # the environment disappears with its shell and never reaches tests.
          AUTH_HEADER="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\r\n')"
          echo "::add-mask::${AUTH_HEADER}"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0='http.https://github.com/.extraheader'
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${AUTH_HEADER}"
          export GIT_TERMINAL_PROMPT=0
          unset AUTH_HEADER

          PREP_BRANCH="release-prep/${VERSION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          PREP_PUSHED=0
          RELEASE_ID=''
          PUBLISHED=0
          assert_tag_absent() {
            local status
            if git ls-remote --exit-code --tags origin \
              "refs/tags/${VERSION}" >/dev/null; then
              echo "::error::tag '${VERSION}' appeared during this release run"
              return 1
            else
              status=$?
              if [ "${status}" -ne 2 ]; then
                echo "::error::could not verify that tag '${VERSION}' is unused"
                return "${status}"
              fi
            fi
          }
          cleanup() {
            if [ "${PUBLISHED}" -eq 0 ] && [ -n "${RELEASE_ID}" ]; then
              CURRENT_RELEASE_ID="$(gh release view "${VERSION}" \
                --json databaseId --jq '.databaseId' 2>/dev/null || true)"
              RELEASE_STATE="$(gh api \
                "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
                --jq '.draft' 2>/dev/null || true)"
              if [ "${RELEASE_STATE}" = 'true' ] && \
                 [ "${CURRENT_RELEASE_ID}" = "${RELEASE_ID}" ] && \
                 [ "$(gh release view "${VERSION}" --json targetCommitish \
                    --jq '.targetCommitish' 2>/dev/null || true)" = \
                   "${RELEASE_COMMIT}" ]; then
                gh api --method DELETE \
                  "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" >/dev/null || true
              fi
            fi
            if [ "${PREP_PUSHED}" -eq 1 ]; then
              git push \
                --force-with-lease="refs/heads/${PREP_BRANCH}:${RELEASE_COMMIT}" \
                origin ":refs/heads/${PREP_BRANCH}" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT

          git push origin "${RELEASE_COMMIT}:refs/heads/${PREP_BRANCH}"
          PREP_PUSHED=1
          assert_tag_absent
          gh release create "${VERSION}" \
            --draft \
            --target "${RELEASE_COMMIT}" \
            --title "${VERSION}" \
            --notes "Prebuilt multi-arch RecklessFFI.xcframework for SwiftReckless ${VERSION}.

          The tagged Package.swift pins this exact asset by URL and checksum. Optimized x86_64 slices require AVX2/BMI2/POPCNT (Haswell-class or newer) and have no runtime baseline dispatch. The NNUE network remains a separately downloaded runtime asset."
          RELEASE_ID="$(gh release view "${VERSION}" \
            --json databaseId --jq '.databaseId')"
          test "$(gh release view "${VERSION}" --json targetCommitish \
            --jq '.targetCommitish')" = "${RELEASE_COMMIT}"
          gh release upload "${VERSION}" "${ASSET}"

          test "$(gh release view "${VERSION}" --json isDraft --jq '.isDraft')" = 'true'
          test "$(gh release view "${VERSION}" --json assets --jq \
            '.assets[] | select(.name == "RecklessFFI.xcframework.zip") | .name')" = "${ASSET}"

          VERIFY_ASSET_DIR="$(mktemp -d)"
          gh release download "${VERSION}" --pattern "${ASSET}" --dir "${VERIFY_ASSET_DIR}"
          cmp "${ASSET}" "${VERIFY_ASSET_DIR}/${ASSET}"
          rm -rf "${VERIFY_ASSET_DIR}"

          assert_tag_absent
          gh release edit "${VERSION}" --draft=false
          PUBLISHED=1
          test "$(gh release view "${VERSION}" --json isDraft --jq '.isDraft')" = 'false'
          test "$(git ls-remote origin "refs/tags/${VERSION}" | \
            awk 'NR == 1 { print $1 }')" = "${RELEASE_COMMIT}"
