[package]
name = "creckless"
version = "0.1.0"
edition = "2021"
description = "Thin C FFI wrapper around the Reckless chess engine for SwiftReckless"
license = "AGPL-3.0"
publish = false

# IMPORTANT: expose both a C static library AND a Rust library.
# SwiftPM links the `staticlib` slice (via the binaryTarget xcframework on
# Apple, or -lcreckless on Android).  The `rlib` slice lets the crate also
# be used as a Rust dependency in future tooling.
[lib]
name = "creckless"
crate-type = ["staticlib", "rlib"]

# ── Engine dependency ─────────────────────────────────────────────────────────
[dependencies]
# libc is needed for c_char, c_void types in the FFI surface.
libc = "0.2"
# Our maintained fork of Reckless (github.com/jaredbrewer/Reckless, branch
# `swiftreckless` on tag v0.9.0): four patches on top of upstream — a [lib]
# target, runtime NNUE loading, per-instance I/O (run_io + uci_out! sink), and
# the terminal-position guard (empty root_moves → "bestmove (none)" instead of
# a SIGABRT; exercised by examples/terminal_guard.rs). Kept local to the fork
# by design (owner decision 2026-07-06 — no upstreaming). Pinned by rev for
# reproducibility; to pull upstream, rebase the fork branch and bump this rev.
reckless = { git = "https://github.com/jaredbrewer/Reckless.git", rev = "420b3d7", default-features = false }

[profile.release]
# LTO is disabled to ensure the C-exported rk_ffi_* symbols appear in
# regular Mach-O object files inside libcreckless.a, which the Apple linker
# (ld) requires for SYMDEF-based symbol resolution.  Fat/thin LTO on Apple
# targets puts all code into LLVM bitcode objects that Apple ld cannot resolve
# from a staticlib's __.SYMDEF table.  LTO can be re-enabled for the xcframework
# (P3) build once we verify the xcframework build script handles it correctly.
lto = false
panic = "abort"
codegen-units = 1
opt-level = 3
