[package]
name = "creckless"
version = "0.1.0"
edition = "2021"
description = "Thin C FFI wrapper around the Reckless chess engine for SwiftReckless"
license = "AGPL-3.0"
publish = false

# IMPORTANT: expose both a C dynamic library AND a Rust library.
# SwiftPM links the `staticlib` slice (via the binaryTarget xcframework on
# Apple, or -lcreckless on Android).  The `rlib` slice lets the crate also
# be used as a Rust dependency in future tooling.
[lib]
name = "creckless"
crate-type = ["staticlib", "rlib"]

# ── Engine dependency ─────────────────────────────────────────────────────────
# TODO: Uncomment and pin once the Reckless crate is wired in.
# The upstream repo does not publish to crates.io (publish = false), so
# we vendor it as a git dependency or path dependency after cloning.
#
# [dependencies]
# reckless = { git = "https://github.com/codedeliveryservice/Reckless.git", tag = "v0.9.0" }
#
# Until then the FFI functions in src/ffi.rs are STUBBED (they return NULL /
# no-op and log to stderr).  The ABI, the thread model, and the Swift + C
# wiring are real.

[dependencies]
# libc is needed for c_char, c_void types in the FFI surface.
libc = "0.2"
# Vendored + minimally-forked Reckless engine (adds lib.rs + [lib] target,
# no engine-logic changes).  See vendor/reckless/src/lib.rs.
reckless = { path = "vendor/reckless", default-features = false }

[profile.release]
lto = "fat"
panic = "abort"
codegen-units = 1
opt-level = 3
